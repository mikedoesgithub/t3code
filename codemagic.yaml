workflows:
  t3-trollstore:
    name: T3 Code TrollStore (iOS 16+, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        APP_VARIANT: production
        EXPO_NO_GIT_STATUS: "1"
        # Personal-team variant: no widgets/share extensions, no App Groups,
        # push, or Apple Sign-In entitlements, so the unsigned bundle installs
        # cleanly under TrollStore.
        T3CODE_IOS_PERSONAL_TEAM: "1"
        T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.t3tools.t3code
        T3CODE_TROLLSTORE: "1"
    scripts:
      - name: Install pnpm and dependencies
        script: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          pnpm install --frozen-lockfile
      - name: Expo prebuild (iOS)
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean
      - name: Archive unsigned for TrollStore
        script: |
          cd apps/mobile
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{f=1;next} f && NF && $1 != "Pods" {print $1; exit}')
          echo "Workspace: $WORKSPACE Scheme: $SCHEME"
          test -n "$SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/T3Code.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Package TrollStore IPA
        script: |
          cd apps/mobile
          APP_PATH=$(find build/T3Code.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload T3Code-trollstore.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y T3Code-trollstore.ipa Payload
          ls -la T3Code-trollstore.ipa
          cd ../..
          cp apps/mobile/T3Code-trollstore.ipa ./T3Code-trollstore.ipa
    artifacts:
      - T3Code-trollstore.ipa
